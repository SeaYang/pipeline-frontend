# Nginx 配置模板
# 供裸机 Nginx 部署和 Docker 容器使用。
#
# Docker 部署时，容器启动脚本（docker-entrypoint.sh）会读取 BACKEND_URL 环境变量，
# 自动替换下方 __BACKEND_URL__ 占位符为实际后端地址。

server {
    listen       80; 
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 静态资源缓存（带 hash 的文件长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history 模式：所有前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理：/api 开头的请求转发到后端服务
    # rewrite 去掉 /api 前缀，与开发环境 Vite proxy 行为一致
    #   /api/demo/list  →  http://__BACKEND_URL__/demo/list
    location /api/ {
        proxy_pass http://__BACKEND_URL__/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（日志流、终端等）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
